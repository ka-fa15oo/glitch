name: Glitch
options:
  bundleIdPrefix: com.kafa1500
  deploymentTarget:
    macOS: "15.0"
targets:
  Glitch:
    type: application
    platform: macOS
    sources:
      - Glitch
      - path: Tools/glitch-hook.sh
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kafa1500.glitch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        # a stable identity keeps the Accessibility permission across rebuilds (ad-hoc changes every build)
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: 45C73BW655
        SWIFT_VERSION: "6.0"
    scheme:
      testTargets: [GlitchTests]
  GlitchTests:
    # logic tests: the sentinel sources are compiled straight into the bundle, so no app (no knight, no sounds) starts
    type: bundle.unit-test
    platform: macOS
    sources:
      - GlitchTests
      - path: Glitch/Sentinel
        excludes: [SentinelController.swift]   # needs Brain, which only the app has
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        SWIFT_VERSION: "6.0"
