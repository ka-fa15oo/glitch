name: Glitch
options:
  bundleIdPrefix: com.kafa1500
  deploymentTarget:
    macOS: "15.0"
targets:
  Glitch:
    type: application
    platform: macOS
    sources:
      - Glitch
      - path: Tools/glitch-hook.sh
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kafa1500.glitch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
    scheme:
      testTargets: [GlitchTests]
  GlitchTests:
    # logic tests: the sentinel sources are compiled straight into the bundle, so no app (no knight, no sounds) starts
    type: bundle.unit-test
    platform: macOS
    sources: [GlitchTests, Glitch/Sentinel]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        SWIFT_VERSION: "6.0"
